AWSTemplateFormatVersion: '2010-09-09'
Description: "Developing Generative AI Applications on AWS - Hands-on Demo EC2 (Session Manager, Auto-Stop)"

# ============================================================================
# このテンプレートは研修「Developing Generative AI Applications on AWS」向けの
# ハンズオン用 EC2 デモ環境を作成します。
#  - Session Manager 経由で接続（SSH キー・インバウンド不要）
#  - Python 3.12 venv に boto3 / langchain / ragas 等をプリインストール
#  - S3 からハンズオン資材を自動ダウンロード
#  - 毎日 23:00 JST に自動停止（コスト削減）
# ============================================================================

Parameters:
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.medium, t3.large, t3.xlarge]
    Description: EC2 インスタンスタイプ（LangChain/Ragas を含むため t3.large 以上を推奨）
  AssetsBucket:
    Type: String
    Description: ハンズオン資材がアップロードされた S3 バケット名
  AssetsPrefix:
    Type: String
    Default: handson-assets
    Description: S3 バケット内のプレフィックス
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 の最新 AMI（SSM パラメータで自動解決。変更不要）

Resources:
  # ==========================================================================
  # VPC
  # ==========================================================================
  DemoVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: GenAIHandsonVPC

  DemoSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: GenAIHandsonSubnet

  DemoIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: GenAIHandsonIGW

  DemoIGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DemoVPC
      InternetGatewayId: !Ref DemoIGW

  DemoRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DemoVPC
      Tags:
        - Key: Name
          Value: GenAIHandsonRT

  DemoRoute:
    Type: AWS::EC2::Route
    DependsOn: DemoIGWAttachment
    Properties:
      RouteTableId: !Ref DemoRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DemoIGW

  DemoSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DemoSubnet
      RouteTableId: !Ref DemoRouteTable

  # ==========================================================================
  # Security Group (Session Manager 経由のためインバウンド不要)
  # ==========================================================================
  DemoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GenAI Handson Demo - Session Manager only (no inbound)
      VpcId: !Ref DemoVPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound (SSM, Bedrock API, S3, etc.)
      Tags:
        - Key: Name
          Value: GenAIHandsonSG

  # ==========================================================================
  # IAM Role (Session Manager + Bedrock + S3 + CloudWatch)
  # ==========================================================================
  DemoInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GenAIHandsonEC2Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/CloudWatchFullAccessV2
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      Policies:
        - PolicyName: BedrockAgentCoreAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:*
                  - bedrock-agentcore-control:*
                Resource: '*'
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                Resource: '*'

  DemoInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref DemoInstanceRole

  # ==========================================================================
  # EC2 Instance
  # ==========================================================================
  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref DemoInstanceProfile
      SubnetId: !Ref DemoSubnet
      SecurityGroupIds:
        - !Ref DemoSecurityGroup
      ImageId: !Ref LatestAmiId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: GenAIHandsonInstance
        - Key: Project
          Value: DevelopingGenAIApplications
        - Key: AutoStop
          Value: "true"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -x
          exec > /var/log/user-data.log 2>&1
          echo "=========================================="
          echo " GenAI ハンズオンデモ環境セットアップ開始"
          echo " $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="

          # システム更新と基本ツール (Amazon Linux 2023 = dnf ベース)
          echo "[1/5] システム更新..."
          dnf update -y
          dnf install -y python3.12 python3.12-pip jq unzip tar git

          # Python venv 作成
          echo "[2/5] Python venv セットアップ..."
          VENV_DIR=/home/ssm-user/.venv
          mkdir -p /home/ssm-user
          python3.12 -m venv $VENV_DIR
          source $VENV_DIR/bin/activate
          pip install --upgrade pip
          # モジュールで使用するパッケージ
          pip install boto3 requests numpy
          pip install langchain langchain-aws langchain-community
          pip install "ragas>=0.2" datasets
          pip install strands-agents strands-agents-tools
          pip install bedrock-agentcore bedrock-agentcore-starter-toolkit

          # ssm-user のログイン時に自動 activate
          echo "source $VENV_DIR/bin/activate" >> /home/ssm-user/.bashrc
          echo "source $VENV_DIR/bin/activate" >> /home/ssm-user/.bash_profile
          echo 'cd ~/handson 2>/dev/null' >> /home/ssm-user/.bashrc
          echo 'cd ~/handson 2>/dev/null' >> /home/ssm-user/.bash_profile

          # python コマンドでどこからでも実行できるようにラッパー作成
          cat > /usr/local/bin/python << 'WRAPPER'
          #!/bin/bash
          source /home/ssm-user/.venv/bin/activate
          exec python "$@"
          WRAPPER
          chmod +x /usr/local/bin/python
          ln -sf $VENV_DIR/bin/pip /usr/local/bin/pip

          # S3 からハンズオン資材をダウンロード
          echo "[3/5] S3 から資材ダウンロード..."
          WORK_DIR=/home/ssm-user/handson
          mkdir -p $WORK_DIR
          aws s3 cp s3://${AssetsBucket}/${AssetsPrefix}/handson.tar.gz /tmp/handson.tar.gz
          tar -xzf /tmp/handson.tar.gz -C $WORK_DIR --strip-components=1
          rm -f /tmp/handson.tar.gz
          chown -R ssm-user:ssm-user /home/ssm-user
          chmod -R 755 /home/ssm-user/handson
          mkdir -p /home/ssm-user/.cache/pip
          chown -R ssm-user:ssm-user /home/ssm-user/.cache

          # リージョン設定
          echo "[4/5] 環境設定..."
          TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
          AWS_REGION=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
          if [ -z "$AWS_REGION" ]; then AWS_REGION=us-east-1; fi
          sudo -u ssm-user aws configure set region $AWS_REGION

          # Bedrock モデル確認
          echo "[5/5] Bedrock モデルアクセス確認..."
          for model in amazon.nova-lite-v1:0 amazon.nova-pro-v1:0 amazon.titan-embed-text-v2:0; do
            r=$(aws bedrock get-foundation-model --model-identifier "$model" --query "modelDetails.modelId" --output text 2>/dev/null || echo "NG")
            [ "$r" != "NG" ] && echo "  OK $model" || echo "  WARN $model (要有効化)"
          done

          echo ""
          echo "=========================================="
          echo " セットアップ完了! $(date '+%Y-%m-%d %H:%M:%S')"
          echo " 接続後は自動で venv が有効化されます"
          echo " python コマンドでスクリプトを実行できます"
          echo "=========================================="

  # ==========================================================================
  # Auto Stop (EventBridge + Lambda: 毎日 23:00 JST に自動停止)
  # ==========================================================================
  StopInstanceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: StopGenAIHandsonInstance
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt StopInstanceRole.Arn
      Environment:
        Variables:
          INSTANCE_ID: !Ref DemoInstance
      Code:
        ZipFile: |
          import boto3
          import os
          def handler(event, context):
              ec2 = boto3.client('ec2')
              instance_id = os.environ['INSTANCE_ID']
              ec2.stop_instances(InstanceIds=[instance_id])
              print(f"Stopped instance: {instance_id}")
              return {"status": "stopped"}

  StopInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StopEC2
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  StopScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: "Auto-stop demo instance daily at 23:00 JST (14:00 UTC)"
      ScheduleExpression: cron(0 14 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt StopInstanceFunction.Arn
          Id: StopGenAIInstance

  StopSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StopInstanceFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StopScheduleRule.Arn

# ==========================================================================
# Outputs
# ==========================================================================
Outputs:
  InstanceId:
    Value: !Ref DemoInstance
    Description: "EC2 Instance ID"
  SessionManagerConnect:
    Value: !Sub "aws ssm start-session --target ${DemoInstance} --region ${AWS::Region}"
    Description: "Session Manager connect command"
  ConsoleURL:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${DemoInstance}"
    Description: "Session Manager console URL"
  StartCommand:
    Value: !Sub "aws ec2 start-instances --instance-ids ${DemoInstance} --region ${AWS::Region}"
    Description: "Start instance command"
  StopCommand:
    Value: !Sub "aws ec2 stop-instances --instance-ids ${DemoInstance} --region ${AWS::Region}"
    Description: "Stop instance command"
  VpcId:
    Value: !Ref DemoVPC
    Description: "VPC ID"
